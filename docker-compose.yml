# =============================================================================
# Docker Compose Orchestration - Toàn Diện Hệ Thống Quản Lý Chấm Công Đại Học
# Đồ án tốt nghiệp: Vũ Tiến Đức - MSV: 2310900023
# Kiến trúc Containers:
#   1. sqlserver: Microsoft SQL Server 2022 (Hỗ trợ ACID Multi-Document Transactions)
#   2. face-service: FastAPI + InsightFace + ArcFace 512D + FAISS RAM
#   3. redis: Redis 7 In-Memory Cache & Message Broker
#   4. minio: MinIO S3-Compatible Object Storage
#   5. web: Node.js Express Backend + React Vite Static Frontend (Single-Port 5000)
# =============================================================================

version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu Microsoft SQL Server 2022
  # -------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qlns_sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-ducyb12398}
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------
  # 2. Python FastAPI InsightFace Biometrics Service
  # -------------------------------------------------------------
  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: qlns_face_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - PORT=8001
      - PYTHONUNBUFFERED=1
      - FACE_MODEL_NAME=buffalo_s
      - FACE_DETECTION_SIZE=320
      - FACE_MATCH_THRESHOLD=0.45
      - FACE_SERVICE_API_KEY=${FACE_SERVICE_API_KEY:-internal_face_service_secret_key_2026_datn_qlns}
    volumes:
      - insightface_models:/root/.insightface
      - ./uploads:/app/uploads
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------------
  # 3. Redis In-Memory & Distributed Cache (v7 Alpine)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qlns_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------
  # 4. MinIO S3-Compatible Object Storage Service
  # -------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: qlns_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------
  # 5. Web Application: Express API + Vite Frontend Static
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlns_web_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      face-service:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_DIALECT=mssql
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=DATN_QLNS_ChamCong_FaceRec
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD:-ducyb12398}
      - DB_ENCRYPT=false
      - DB_TRUST_SERVER_CERTIFICATE=true
      - REDIS_URL=redis://redis:6379
      - STORAGE_DRIVER=minio
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=datn-qlns-storage
      - FACE_SERVICE_URL=http://face-service:8001
      - FACE_SERVICE_API_KEY=${FACE_SERVICE_API_KEY:-internal_face_service_secret_key_2026_datn_qlns}
      - ATTENDANCE_EVIDENCE_DIR=/app/uploads/attendance-evidence
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_daihoc_2026_datn_qlns}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-super_secret_refresh_key_daihoc_2026_datn_qlns}
      - TERMINAL_KEY=${TERMINAL_KEY:-super_secret_terminal_key_daihoc_2026_datn_qlns}
      - JWT_EXPIRES_IN=1d
      - REFRESH_TOKEN_EXPIRES_DAYS=7
      - CORS_WHITELIST=http://localhost:5000,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,https://chamcongdh.io.vn
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/suc-khoe"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s

# -------------------------------------------------------------
# Volumes lưu trữ dữ liệu vĩnh cửu
# -------------------------------------------------------------
volumes:
  sqlserver_data:
    name: qlns_sqlserver_data
  redis_data:
    name: qlns_redis_data
  minio_data:
    name: qlns_minio_data
  insightface_models:
    name: qlns_insightface_models

# -------------------------------------------------------------
# Mạng nội bộ kết nối giữa các Containers
# -------------------------------------------------------------
networks:
  app_network:
    name: qlns_network
    driver: bridge

